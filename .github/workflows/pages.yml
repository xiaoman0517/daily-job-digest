name: Publish job archive

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, score, and archive jobs
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Add the DEEPSEEK_API_KEY Actions secret."
            exit 1
          fi
          if [ -z "$SKILL_PROFILE_TEXT" ]; then
            echo "::error::Add the SKILL_PROFILE_TEXT Actions secret."
            exit 1
          fi
          python daily_job_digest.py --web-export
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SKILL_PROFILE_TEXT: ${{ secrets.SKILL_PROFILE_TEXT }}
          TIMEZONE: Asia/Shanghai
          USE_SYSTEM_PROXY: "false"

      - name: Commit updated daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update daily job archive"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
